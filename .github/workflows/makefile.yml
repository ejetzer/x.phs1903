name: Build everything

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: checkout repo
          uses: actions/checkout@v4
        
        - name: ajouter deadsnake
          run: sudo add-apt-repository ppa:deadsnakes/ppa
        
        - name: mettre apt à jour
          run: sudo apt-get update -y

        - name: installer zsh
          run: sudo apt-get install -y zsh
        
        - name: installer python
          run: sudo apt-get install -y python3.14
        
        - name: installer libclang
          run: sudo apt-get install -y libclang-14-dev
        
        - name: installer TeXlive
          run: sudo apt-get install -y texlive-full
        
        - name: installer pipenv
          run: python3.14 -m pip install pipenv
        
        - name: installer le venv
          run: pipenv install

        - name: tout compiler
          run: make github-build
