name: Build everything

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: checkout repo
          uses: actions/checkout@v4

        - name: installer zsh
          run: sudo apt-get install -y zsh
        
        - name: installer python
          run: sudo apt-get install -y python3.14
        
        - name: installer pipenv
          run: python3.14 -m pip install pipenv
        
        - name: installer le venv
          run: pipenv install

        - name: Tout compiler
          run: make github-build
