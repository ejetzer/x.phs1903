name: Check syntax and format

on: push

permissions:
  contents: read

jobs:
  ruff-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff check
        args: --config pyproject.toml

  ruff-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format --check --diff
        args: --config pyproject.toml



