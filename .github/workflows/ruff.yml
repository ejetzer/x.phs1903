name: Check syntax and format

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ruff-check:
    runs-on: ubuntu-latest

    steps:

      - name: installer python
        id: apt-py
        uses: actions/setup-python@v5
        if: ${{ always() }}
        with:
          python-version: '3.14'

      - name: installer pipenv
        id: pip-env
        run: python3 -m pip install pipenv
        if: ${{ always() }}

      - name: checkout repo
        id: checkout
        uses: actions/checkout@v4
        if: ${{ always() }}

      - name: installer le venv
        id: venv
        run: python3 -m pipenv install
        if: ${{ always() }}

      - name: Run checks
        id: ruff-check
        run: python3 -m pipenv run ruff check --output-format=github .

  ruff-format:
    runs-on: ubuntu-latest

    steps:

      - name: installer python
        id: apt-py
        uses: actions/setup-python@v5
        if: ${{ always() }}
        with:
          python-version: '3.14'

      - name: installer pipenv
        id: pip-env
        run: python -m pip install pipenv
        if: ${{ always() }}

      - name: checkout repo
        id: checkout
        uses: actions/checkout@v4
        if: ${{ always() }}

      - name: installer le venv
        id: venv
        run: python -m pipenv install
        if: ${{ always() }}

      - name: Run checks
        id: ruff-check
        run: python3 -m pipenv run ruff format --diff



